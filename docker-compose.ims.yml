# Production stack. Secrets come from `.env` next to this file (see .env.example)
# and `.env.backend` (JWT_SECRET etc.). First-time / migration steps: docs/mongo-auth-runbook.md
services:
  mongo:
    image: mongo:8
    container_name: ims_mongo
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo/keyfile"]
    environment:
      # Only used when the data volume is empty (first boot)
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
      # Must be chmod 400 and owned by uid 999 (see runbook)
      - ./mongo/keyfile:/etc/mongo/keyfile:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ims_net

  mongo-init:
    image: mongo:8
    container_name: ims_mongo_init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGO_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_APP_DB=${MONGO_APP_DB:-ims}
      - MONGO_APP_USERNAME=${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME in .env}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}
    volumes:
      - ./mongo/init-replica.sh:/init-replica.sh:ro
    entrypoint: ["sh", "/init-replica.sh"]
    networks:
      - ims_net

  backend:
    image: ghcr.io/codemonix/ims_backend:latest
    container_name: ims_backend
    restart: unless-stopped
    env_file: .env.backend
    environment:
      - DB_URI=mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@ims_mongo:27017/${MONGO_APP_DB:-ims}?replicaSet=rs0&authSource=${MONGO_APP_DB:-ims}
      - PORT=5000
    ports:
      # Localhost only: the host nginx is the single public entry point
      - "127.0.0.1:5000:5000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.250'
          memory: 256M
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks:
      - ims_net
    volumes:
      # The image runs as uid 1000 ("node"); the host folder must be writable by it (see runbook)
      - ./uploads:/app/uploads

  frontend:
    image: ghcr.io/codemonix/ims_frontend:latest
    container_name: ims_frontend
    restart: unless-stopped
    networks:
      - ims_net
    environment:
      - API_BASE=/api
      - IS_DEMO=${IS_DEMO:-true}
    ports:
      - "127.0.0.1:3000:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '128m'

        reservations:
          cpus: '0.05'
          memory: 64M


networks:
  ims_net:
    driver: bridge
volumes:
  mongo_data:
