# Local full-stack run: builds the images from source and serves everything on http://localhost
# Copy .env.example to .env first, and create mongo/keyfile (see docs/mongo-auth-runbook.md).

services:
  mongo:
    image: mongo:8
    container_name: ims_mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo/keyfile"]
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    ports:
      # Localhost only, for tools like Compass (use ?directConnection=true)
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/keyfile:/etc/mongo/keyfile:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ims_net

  mongo-init:
    image: mongo:8
    container_name: ims_mongo_init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGO_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_APP_DB=${MONGO_APP_DB:-ims}
      - MONGO_APP_USERNAME=${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME in .env}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}
    volumes:
      - ./mongo/init-replica.sh:/init-replica.sh:ro
    entrypoint: ["sh", "/init-replica.sh"]
    networks:
      - ims_net

  frontend:
    build: ./client
    image: ims_frontend:latest
    container_name: ims_frontend
    restart: unless-stopped
    networks:
      - ims_net
    environment:
      - API_BASE=/api
    # no ports mapped; host-nginx reaches it by service name

  backend:
    build: ./server
    image: ims_backend:latest
    container_name: ims_backend
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks:
      - ims_net
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - DEFAULT_USER_APPROVED=${DEFAULT_USER_APPROVED:-false}
      - DB_URI=mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@ims_mongo:27017/${MONGO_APP_DB:-ims}?replicaSet=rs0&authSource=${MONGO_APP_DB:-ims}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - 5000

  host-nginx:
    image: nginx:1.27-alpine
    container_name: ims_host_nginx
    restart: unless-stopped
    volumes:
      - ./host-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - ims_net

networks:
  ims_net:
    driver: bridge

volumes:
  mongo_data:
  uploads_data:
